<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in · Roamly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="auth">
    <header id="nav"></header>
    <div class="auth">
      <div class="art">
        <img src="images/kyoto.jpg" alt="" />
        <h2>Welcome to somewhere quieter.</h2>
      </div>
      <div class="form">
        <div class="box">
          <h1>Welcome back</h1>
          <p>Sign in to your Roamly account.</p>
          <form data-form data-next="index.html" novalidate>
            <div class="row">
              <label>Email address</label
              ><input
                type="email"
                data-rule="email"
                placeholder="you@example.com"
              />
            </div>
            <div class="row">
              <label>Password</label
              ><input
                type="password"
                data-rule="password"
                placeholder="Enter your password"
              /><button type="button" class="eye">Show</button>
            </div>
            <div class="row">
              <label style="font-weight: 500"
                ><input type="checkbox" style="width: auto" /> Remember me on
                this device</label
              >
            </div>
            <p style="margin-bottom: 18px">
              <a href="forgot.html"><b>Forgot password?</b></a>
            </p>
            <button class="btn full" type="submit">Sign in</button>
          </form>
          <p class="links">
            New to Roamly? <a href="signup.html">Create account</a>
          </p>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/fx.js"></script>
    <script>
      fx();
    </script>
  </body>
</html>
