<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Check your inbox · Roamly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="auth">
    <header id="nav"></header>
    <div class="auth">
      <div class="art">
        <img src="images/copenhagen.jpg" alt="" />
        <h2>Help is on its way.</h2>
      </div>
      <div class="form">
        <div class="box">
          <div class="mailbox">
            <div class="env"></div>
            <h1>Check your inbox</h1>
            <p>
              If an account exists for this email, you'll receive a password
              reset link shortly.
            </p>
          </div>
          <div
            class="panel"
            style="margin: 0 0 20px; background: var(--mist); border: 0"
          >
            <b>Haven't received an email?</b>
            <p style="font-size: 14px; color: var(--mute)">
              Check your spam folder and allow a few minutes. You can request
              another link after 60 seconds.
            </p>
          </div>
          <a class="btn full" href="signin.html">Back to sign in</a
          ><button
            class="btn full"
            id="resend"
            style="margin-top: 12px"
            disabled
          >
            Resend link in 60s
          </button>
          <p class="links"><a href="forgot.html">Use a different email</a></p>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/fx.js"></script>
    <script>
      fx();
    </script>
  </body>
</html>
