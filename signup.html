<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create account · Roamly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="auth">
    <header id="nav"></header>
    <div class="auth">
      <div class="art">
        <img src="images/lisbon.jpg" alt="" />
        <h2>Start with a simple idea.</h2>
      </div>
      <div class="form">
        <div class="box">
          <h1>Start with an account</h1>
          <p>Create your Roamly account. All fields are required.</p>
          <form data-form data-next="index.html" novalidate>
            <div class="row">
              <label>Full name</label
              ><input data-rule="name" placeholder="Your full name" />
            </div>
            <div class="row">
              <label>Email address</label
              ><input
                type="email"
                data-rule="email"
                placeholder="you@example.com"
              />
            </div>
            <div class="row">
              <label>Password</label
              ><input
                type="password"
                data-rule="newpass"
                placeholder="Create a password"
              /><button type="button" class="eye">Show</button
              ><small style="color: var(--mute)"
                >Use at least 8 characters, including a letter and a
                number.</small
              >
            </div>
            <div class="row">
              <label style="font-weight: 500"
                ><input type="checkbox" style="width: auto" required /> I agree
                to the Terms of Service and Privacy Policy</label
              >
            </div>
            <button class="btn full" type="submit">Create account</button>
          </form>
          <p class="links">
            Already have an account? <a href="signin.html">Sign in</a>
          </p>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/fx.js"></script>
    <script>
      fx();
    </script>
  </body>
</html>
