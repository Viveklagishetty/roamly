<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset password · Roamly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="auth">
    <header id="nav"></header>
    <div class="auth">
      <div class="art">
        <img src="images/vancouver.jpg" alt="" />
        <h2>Everyone loses the map sometimes.</h2>
      </div>
      <div class="form">
        <div class="box">
          <h1>Forgot your password?</h1>
          <p>
            Enter the email you used for Roamly. We'll send instructions to
            reset your password.
          </p>
          <form data-form data-next="inbox.html" novalidate>
            <div class="row">
              <label>Email address</label
              ><input
                type="email"
                data-rule="email"
                placeholder="you@example.com"
              />
            </div>
            <button class="btn full" type="submit">Send reset link</button>
          </form>
          <p class="links"><a href="signin.html">Back to sign in</a></p>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/fx.js"></script>
    <script>
      fx();
    </script>
  </body>
</html>
